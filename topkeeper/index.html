<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download TopKeeper</title>

  <link rel="preload" as="image" href="/icons/windows.svg">
  <link rel="preload" as="image" href="/images/background.jpg">

  <style>
    @font-face {
      font-family: 'SF Pro Text Custom';
      src: url('/fonts/sf-pro-text_regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'SF Pro Display Custom';
      src: url('/fonts/sf-pro-display_bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background:
        linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
        url('/images/background.jpg') center / cover no-repeat fixed;
      background-color: #000;

      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text Custom', 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow: hidden;
    }

    .topbar {
      position: relative;
      width: 100%;
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 28px;
      background: #ffffff;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08);
      z-index: 100;
    }

    .topbar a {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .topbar img {
      height: 36px;
      width: auto;
      display: block;
      transition: opacity 0.25s ease;
    }

    .topbar img:hover {
      opacity: 0.7;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      min-height: 0;
      position: relative;
      z-index: 1;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 18px;
      margin-bottom: 26px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #c7c7cc;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.03em;
      line-height: 1;
      white-space: nowrap;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #30d158;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(48, 209, 88, 0.7);
    }

    .hero h1 {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display Custom', 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
      font-size: clamp(48px, 9vw, 96px);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.1;
      margin-bottom: 20px;

      background: linear-gradient(135deg, #ff6b6b 0%, #feca57 25%, #48dbfb 55%, #a29bfe 80%, #fd79a8 100%);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;

      animation: gradient-slide 6s ease infinite;
    }

    @keyframes gradient-slide {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .hero .subtitle {
      font-size: clamp(18px, 2.4vw, 24px);
      font-weight: 400;
      color: #b0b0b5;
      line-height: 1.5;
      margin-bottom: 48px;
      letter-spacing: 0.01em;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 44px;
      border: none;
      border-radius: 14px;
      background: #d1d1d6;
      color: #000;
      font-family: inherit;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.01em;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      transition: background-color 0.25s ease, color 0.25s ease, transform 0.15s ease;
    }

    .download-btn .btn-icon {
      width: 19px;
      height: 19px;
      display: block;
      flex-shrink: 0;
      filter: brightness(0);
      transition: filter 0.25s ease;
    }

    .download-btn:hover {
      background: #ffffff;
      color: #000;
    }

    .download-btn:active {
      transform: scale(0.94);
    }

    .footer-credit {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      width: 100%;
      padding: 0 24px 18px;
      text-align: center;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: 0.03em;
      color: rgba(255, 255, 255, 0.45);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
      user-select: none;
    }

    @media (forced-colors: active) {
      body {
        background: Canvas;
      }
      .hero h1 {
        background: none;
        -webkit-text-fill-color: currentColor;
        color: CanvasText;
      }
      .badge {
        border: 1px solid CanvasText;
      }
      .download-btn {
        border: 2px solid ButtonText;
        background: ButtonFace;
        color: ButtonText;
      }
      .footer-credit {
        color: CanvasText;
      }
    }

    @media (max-width: 480px) {
      .topbar {
        height: 52px;
        padding: 0 18px;
      }

      .topbar img {
        height: 28px;
      }

      .badge {
        font-size: 12px;
        padding: 6px 14px;
        margin-bottom: 20px;
      }

      .hero h1 {
        font-size: clamp(38px, 12vw, 60px);
        margin-bottom: 14px;
        letter-spacing: 0.015em;
      }

      .hero .subtitle {
        font-size: clamp(15px, 3.8vw, 18px);
        margin-bottom: 36px;
      }

      .download-btn {
        padding: 14px 30px;
        font-size: 16px;
        border-radius: 12px;
        gap: 10px;
      }

      .download-btn .btn-icon {
        width: 17px;
        height: 17px;
      }

      .footer-credit {
        font-size: 11px;
        padding: 0 18px 14px;
      }
    }
  </style>
</head>
<body>

  <nav class="topbar">
    <a href="https://zhdyzx.cn" target="_blank" rel="noopener noreferrer" aria-label="访问 zhdyzx.cn">
      <img src="https://zhdyzx.cn/sites/zhedu/themes/mix_and_match/images/top_logo.png"
           alt="zhdyzx.cn logo">
    </a>
  </nav>

  <main class="hero">

    <div class="badge">Free &amp; Privacy-First</div>

    <h1>TopKeeper</h1>
    <p class="subtitle">Keep your window always on top.</p>

    <a class="download-btn"
       href="https://wwaoq.lanzouq.com/i8rT149gf0te"
       target="_blank"
       rel="noopener noreferrer">
      <img class="btn-icon" src="/icons/windows.svg" alt="" aria-hidden="true">
      <span>Download TopKeeper</span>
    </a>

  </main>

  <footer class="footer-credit">Developed by 1406.</footer>

</body>
</html>
